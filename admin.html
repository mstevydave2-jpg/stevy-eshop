<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commandes — STEVY_ESHOP</title><style>body{margin:0;background:#080b16;color:#f4f7ff;font:15px system-ui;padding:20px}main{max-width:900px;margin:auto}input,button{padding:12px;border-radius:9px;border:1px solid #35435d;background:#111a2c;color:white}button{background:#36dff5;color:#07101d;font-weight:bold}article{background:#111a2c;border:1px solid #35435d;border-radius:12px;padding:15px;margin:12px 0}small{color:#9eabc2}.paid{color:#43e6a1}.pending{color:#ffd166}.failed{color:#ff8c8c}</style><main><h1>STEVY_ESHOP — Commandes</h1><p>Tableau privé. Ne partage jamais ton jeton administrateur.</p><input id="token" type="password" placeholder="Jeton administrateur" autocomplete="off"><button id="load">Afficher les commandes</button><p id="msg"></p><section id="orders"></section></main><script>document.getElementById('load').onclick=async()=>{const msg=document.getElementById('msg'),box=document.getElementById('orders');msg.textContent='Chargement…';box.replaceChildren();try{const r=await fetch('/.netlify/functions/admin-orders',{headers:{Authorization:'Bearer '+document.getElementById('token').value}});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');msg.textContent=d.orders.length+' commande(s)';for(const o of d.orders){const a=document.createElement('article');const title=document.createElement('h3');title.textContent=o.orderId+' — '+o.game+' / '+o.pack;const p=document.createElement('p');p.textContent=o.amount.toLocaleString('fr-FR')+' FCFA · '+o.player+' · '+o.phone;const st=document.createElement('p');st.className=o.status==='success'?'paid':(['failed','cancelled','refunded'].includes(o.status)?'failed':'pending');st.textContent='Statut : '+o.status;const date=document.createElement('small');date.textContent=o.createdAt; a.append(title,p,st,date);if(o.status==='success'){const link=document.createElement('a');link.href='https://wa.me/24176436208?text='+encodeURIComponent('Paiement confirmé — '+o.orderId+'\nJeu : '+o.game+'\nPack : '+o.pack+'\nJoueur : '+o.player+'\nMontant : '+o.amount+' FCFA');link.target='_blank';link.rel='noopener';link.textContent='Ouvrir WhatsApp pour traiter cette commande';link.style.display='block';link.style.marginTop='12px';a.append(link)}box.append(a)}}catch(e){msg.textContent=e.message}};</script></html>
